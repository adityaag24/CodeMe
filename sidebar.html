<html>
    <head>
        <script src="https://kit.fontawesome.com/318ea5b02c.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <link rel="icon" type="image/png" href="./resources/my-icon.png">
        <style>
            #heading{
                color:white;
                margin-top:5px;
            }
            body{
                background-color:#5d6169;
            }
            .output-window{
                background-color: inherit;
            }
            .input-section{
                background-color: inherit;
                display: flex;
                flex-direction: row;
                margin-bottom: 10px;
                align-items: center;
                width: 100%;
            }
            .button-area{
                background-color: inherit;
            }
            /* styles for textarea element */
            #output-area {
                width: 100%;
                height: 100%;
                overflow-y: auto;
                border: 1px solid black;
                color: white;
                font-size: 20px;
                background-color:#5d6169;
            }
            /* styles for input element */
            #query-field {
                flex: 1;
                padding: 10px;
                font-size: 20px;
                border: 1px solid black;
                color: white;
                background-color: #6f7275;
            }
            /* styles for button element */
            button {
                padding: 5px 10px;
                border: 1px solid black;
                margin: 5px;
                font-family: 'Arial';
                font-size: 20px;
                cursor: pointer;
            }   
            #check-button{
                border:none;
                font-size:25px;
                background-color: #337ef5;
                color:white;
            }
            #trash-can-clear{
                background-color: #5d6169;
                color:white;
                margin-top:5px;
            }
            input[type=text]:focus{
                background-color:black;
            }
            .top-right{
                position: absolute;
                border: none;
                top: 0px;
                right: 10px;
                font-size:10px;
            }
            .btn-matrix{
                position:absolute;
                bottom:5px;
                left:15px;
            }
        </style>
    </head>
    <body>
        <h5 id="heading">CodeMe</h5>
        <div class="output-window">
            <button class="top-right" disabled id="trash-can-clear"><i class="fas fa-trash-alt"></i></button>
            <textarea id="output-area" readonly rows="10" cols="100"></textarea>
        </div>
        <div class="input-section">
            <input type="text" id="query-field" />
            <button id="check-button">&rArr;</button>
        </div>
        <div class="btn-group btn-matrix" role="group" aria-label="Basic example">
            <button type="button" id="generateBtn"  class="btn btn-primary">Generate</button>
            <button type="button" id="explainBtn"   class="btn btn-primary">Explain</button>
            <button type="button" id="summarizeBtn" class="btn btn-primary">Summarize</button>
        </div>
    </body>
    <script>
        const input = document.getElementById('query-field');
        const processButton = document.getElementById('check-button');
        const generateBtn = document.getElementById('generateBtn');
        const explainBtn = document.getElementById('explainBtn');
        const summarizeBtn = document.getElementById('summarizeBtn');
        const output = document.getElementById('output-area');
        const clearBtn = document.getElementById('trash-can-clear');
        clearBtn.addEventListener('click',() => {
            output.textContent='';
            clearBtn.disabled=true;
        })
        processButton.addEventListener('click', () => {
            const text = input.value;
            output.textContent = processText(text);
            clearBtn.disabled=false;
        });
        generateBtn.onclick = function() {
            const text = input.value;
            const message = {text};
            window.parent.postMessage(message, '*');
        };
        explainBtn.addEventListener('click',() => {
            const text = input.value;
            window.parent.postMessage({ command: text, message }, '*');
        });
        summarizeBtn.addEventListener('click',() => {
            const text = input.value;
            window.parent.postMessage({ command: text, message }, '*');
        });
        input.addEventListener('keyup', (event) => {
            if (event.keyCode === 13) { 
                processButton.click();
                input.value="";
            }
        });
        function processText(text) {
            return 'Hi '+text;
        }
    </script>
</html>
